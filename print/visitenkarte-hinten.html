<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Visitenkarte Rückseite</title>
<style>
  /* Endformat 85 × 55 mm · Canvas mit 2 mm Beschnitt = 1051 × 697 px @300dpi
     Rechts ist eine freie Fläche für den QR-Code von Vistaprint reserviert. */

  @font-face { font-family:'Space Grotesk'; src:url('../fonts/space-grotesk-500.woff2') format('woff2'); font-weight:500; font-display:block; }
  @font-face { font-family:'Space Grotesk'; src:url('../fonts/space-grotesk-600.woff2') format('woff2'); font-weight:600; font-display:block; }
  @font-face { font-family:'Inter'; src:url('../fonts/inter-400.woff2') format('woff2'); font-weight:400; font-display:block; }
  @font-face { font-family:'Inter'; src:url('../fonts/inter-500.woff2') format('woff2'); font-weight:500; font-display:block; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1051px; height:697px; overflow:hidden; background:#0B0D12; }

  .card {
    position:relative; width:1051px; height:697px;
    background:
      radial-gradient(620px 500px at 4% 6%,   rgba(99,102,241,0.17), transparent 62%),
      radial-gradient(560px 460px at 96% 98%, rgba(34,211,238,0.10), transparent 60%),
      #0B0D12;
    overflow:hidden;
  }

  .inner {
    position:absolute; left:88px; top:59px;
    width:875px; height:579px;
    display:flex; align-items:stretch; gap:52px;
  }

  .col-text { flex:1; display:flex; flex-direction:column; justify-content:space-between; padding:6px 0 4px; }

  /* --- Kopf: kleines Markenzeichen --- */
  .brand { display:flex; align-items:center; gap:16px; }
  .brand img { width:58px; height:58px; display:block; }
  .brand .name {
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:31px; letter-spacing:-0.7px; color:#F2F4FD;
  }
  .brand .name span {
    background:linear-gradient(100deg,#818CF8 0%, #22D3EE 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* --- Person --- */
  .person h1 {
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:54px; line-height:1.06; letter-spacing:-1.4px; color:#FFFFFF;
  }
  .person p {
    margin-top:12px;
    font-family:'Inter', sans-serif; font-weight:500;
    font-size:28px; letter-spacing:0.9px; text-transform:uppercase;
    color:#7C86F0;
  }

  /* --- Kontakt --- */
  .contact { display:flex; flex-direction:column; gap:11px; }
  .contact div {
    font-family:'Inter', sans-serif; font-weight:400;
    font-size:29px; line-height:1.3; color:#D3D7E8;
  }
  .contact .site { font-weight:500; color:#FFFFFF; font-size:31px; }
  .contact .muted { color:#8D93AB; font-size:27px; }

  /* --- Reservierte Fläche für den QR-Code (bleibt bewusst leer) --- */
  .qr-zone { width:250px; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div class="card">
  <div class="inner">
    <div class="col-text">
      <div class="brand">
        <img src="../images/logo-master.png" alt="">
        <div class="name">Pixel<span>Seite</span></div>
      </div>

      <div class="person">
        <h1>Patrik Hafner</h1>
        <p>Webdesign &amp; Entwicklung</p>
      </div>

      <div class="contact">
        <div class="site">pixelseite.ch</div>
        <div>kontakt@pixelseite.ch</div>
        <div>079 501 26 53</div>
        <div class="muted">Altdorf UR, Schweiz</div>
      </div>
    </div>

    <div class="qr-zone"><!-- frei für den QR-Code aus dem Vistaprint-Editor --></div>
  </div>
</div>
</body>
</html>
